name: Windows EXE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name kayjuubee-USB --add-data "assets;assets" app.py
      - name: Check packaged EXE
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './dist/kayjuubee-USB.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE self-test failed: $($process.ExitCode)" }
          if (-not (Test-Path 'self-test-report.json')) { throw 'EXE produced no self-test report' }
      - uses: actions/upload-artifact@v4
        with:
          name: kayjuubee-USB-Windows
          path: |
            dist/kayjuubee-USB.exe
            self-test-report.json
